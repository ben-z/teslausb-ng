[Unit]
RequiresMountsFor=/usr/local/bin/teslausb /etc/teslausb.conf

[Service]
ExecStartPre=/usr/local/bin/teslausb wifi-priorities --supplicant-config /run/netplan/wpa-wlan0.conf
ExecReload=
ExecReload=/usr/local/bin/teslausb wifi-priorities --supplicant-config /run/netplan/wpa-wlan0.conf
ExecReload=/sbin/wpa_cli -i wlan0 reconfigure
